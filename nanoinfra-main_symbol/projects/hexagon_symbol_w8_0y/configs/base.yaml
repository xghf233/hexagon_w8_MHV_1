defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null

data_dir: ???
metadata_sha256: ???
output_dir: ???
resume_from: null
stop_after_steps: null
sequence_len: 16
device_batch_size: 128
total_batch_size: 2048  # nominal tokens, not samples; 128 samples/update, accumulation=1
seed: 42
compile: false
head_softcap: 15.0
model:
  n_layer: 4
  n_embd: 256
  n_head: 4
  n_kv_head: 4
max_steps: 35024  # ceil(500 * 8966 / 128), candidate formal budget, NOT the smoke default
overfit_n_samples: null
require_overfit_exact: false

optimizer:
  type: adamw
  lr_max: 0.0002
  embedding_lr: 0.14
  unembedding_lr: 0.0028
  weight_decay: 0.01
  betas: [0.9, 0.95]
  fused: true
  max_grad_norm: 1.0
  scheduler:
    type: linear
    warmup_steps: 200
    warmdown_ratio: 0.2
    final_lr_frac: 0.0

evaluation:
  subset_size: 512
  subset_seed: 20260913
  interval_steps: 500
  full_interval_steps: 500
  full_validation: true
  gen_batch_size: 64
  train_diagnostic_size: 256
checkpoint:
  save_every: 2500
logging:
  log_every: 50
