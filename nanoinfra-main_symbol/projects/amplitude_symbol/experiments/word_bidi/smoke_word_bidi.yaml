# smoke_word_bidi.yaml — quick smoke test for word-bidirectional attention.
#
# 500 steps only to verify the pipeline:
#   - word_bidirectional_mask attached correctly
#   - batch 512 works on RTX 5090
#   - torch.compile doesn't blow up
#   - loss goes down
#
# Budget: ~500 steps, ≤ 5 min on RTX 5090.
#
# NOTE: Hydra with _self_ replaces dicts entirely, so all optimizer/scheduler
# keys must be listed here (they won't be inherited from base).

defaults:
  - ../../configs/base
  - _self_

hydra:
  job:
    chdir: false

model:
  n_layer: 4
  n_embd: 512
  n_head: 8
  n_kv_head: 8

sequence_len: 32
seed: 42
max_steps: 500
device_batch_size: 512
total_batch_size: 16384
compile: true

optimizer:
  type: adamw
  lr_max: 3.0e-4
  max_grad_norm: 1.0
  weight_decay: 0.01
  betas: [0.9, 0.95]
  fused: true
  embedding_lr: 0.2
  unembedding_lr: 0.004
  scheduler:
    type: linear
    warmup_steps: 50
    warmdown_ratio: 0.0
    final_lr_frac: 0.0

logging:
  log_every: 50

checkpoint:
  enabled: true
  save_every: 500
  save_dir: "models/amplitude_symbol/smoke_word_bidi"
  keep_last_n: 2

evaluation:
  enabled: true
  interval_steps: 500
  n_samples: 256
  split: val
  gen_batch_size: 64
  save_predictions: true

wandb:
  enabled: false
  name: "smoke_word_bidi"
